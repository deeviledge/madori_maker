<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>事業計画スタジオ v43</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFCFD;--app-bg:#E9EEF2;--panel:#FFFFFF;--ink:#16232F;--ink-soft:#54677A;
  --line:#CBD6DF;--line-soft:#E3EAEF;--grid:#DCE5EB;--grid-major:#B9C8D3;--wall:#2A3A49;
  --accent:#0E7C86;--accent-soft:#E2F1F2;--wood:#A6763C;--own:#34506B;--rent:#0E7C86;
  --ok:#1E7A45;--ok-bg:#E7F4EC;--ng:#B4402F;--ng-bg:#FBEDEA;--warn:#C97A1E;--warn-bg:#FBF3E4;
  --mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Space Grotesk','Noto Sans JP',system-ui,sans-serif;--jp:'Noto Sans JP',system-ui,sans-serif;
  --tabbar-h:56px;--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--app-bg);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
.app{display:flex;flex-direction:column;height:100dvh}
button{font-family:var(--jp)}
/* ---------- Header ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--ink);color:#fff;z-index:40;flex:0 0 auto}
.hleft{min-width:0;flex:1 1 auto;overflow:hidden}
.hright{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--mono);font-size:8.5px;opacity:.6;letter-spacing:.5px}
.subhead{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--ink);color:#fff;border-top:1px solid rgba(255,255,255,.08);flex:0 0 auto}
.subhead .modebar{flex:0 0 auto}
.subhead #scenSel{flex:1 1 auto;min-width:0;width:100%;font-family:var(--jp);font-weight:600;font-size:12px;padding:8px 9px;border:1px solid rgba(255,255,255,.28);border-radius:8px;background:rgba(255,255,255,.14);color:#fff}
.subhead #scenSel option{color:var(--ink)}
.menuBtn{width:36px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:17px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
/* ---------- Tabbar ---------- */
nav.tabbar{display:flex;background:var(--panel);border-top:1px solid var(--line);z-index:45;flex:0 0 auto;overflow-x:auto;scrollbar-width:none;padding-bottom:var(--sab)}
nav.tabbar::-webkit-scrollbar{display:none}
nav.tabbar button{flex:1 0 auto;min-width:60px;border:none;background:none;padding:6px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);font-size:10.5px;font-weight:700;position:relative}
nav.tabbar button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabbar button.active{color:var(--accent)}
nav.tabbar button.active::after{content:'';position:absolute;top:0;left:12%;right:12%;height:2.5px;border-radius:0 0 3px 3px;background:var(--accent)}
/* ---------- Views ---------- */
main{flex:1;min-height:0;position:relative}
.view{display:none;height:100%}
.view.active{display:flex;flex-direction:column}
.scrollview{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(20px + var(--sab));}
.scrollview .inner{max-width:760px;margin:0 auto}
/* ---------- Plan view ---------- */
#view-plan{flex-direction:column}
.plantop{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
.plantop::-webkit-scrollbar{display:none}
.ftabs{display:flex;gap:5px;flex:0 0 auto}
.floorlbl{font-family:var(--jp);font-size:10px;font-weight:700;color:var(--ink-soft);flex:0 0 auto;letter-spacing:.5px}
.floorbtn{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;font-family:var(--jp);font-size:12px;font-weight:700;cursor:pointer;flex:0 0 auto;white-space:nowrap}
.floorbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.floorbtn:active{background:var(--accent);color:#fff}
.ftab{font-family:var(--mono);font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#F4F7F9;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.ftab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.lockbtn{min-width:auto;padding:0 12px;font-family:var(--jp);font-size:12px;font-weight:800;gap:5px;display:flex;align-items:center}
.lockbtn.editing{background:var(--accent);color:#fff;border-color:var(--accent)}
.lockbtn.viewing{background:#F0F3F5;color:var(--ink-soft)}
.viewbadge{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:18;background:rgba(22,35,47,.86);color:#fff;font-size:11px;font-weight:700;font-family:var(--jp);padding:5px 12px;border-radius:999px;pointer-events:none;display:none}
.viewbadge.show{display:block}
.iconbtn{min-width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:15px;color:var(--ink);flex:0 0 auto;padding:0 8px}
.iconbtn:active{background:var(--accent-soft)}
.zoomval{font-family:var(--mono);font-size:11px;color:var(--ink-soft);min-width:38px;text-align:center;flex:0 0 auto}
.planbody{flex:1;display:flex;min-height:0}
.stage{flex:1;position:relative;overflow:auto;background:var(--app-bg);touch-action:pan-x pan-y}
.canvaswrap{padding:40px;min-width:min-content;min-height:min-content}
svg.sheet{display:block;background:var(--paper);box-shadow:0 1px 2px rgba(22,35,47,.06),0 8px 24px rgba(22,35,47,.09);border:1px solid var(--line);touch-action:none}
.obj{cursor:grab}
/* selection action bar (mobile) */
.selbar{position:absolute;display:none;gap:6px;background:var(--ink);border-radius:12px;padding:8px;box-shadow:0 8px 24px rgba(22,35,47,.35);z-index:20;align-items:center}
.selbar.pos-bottom{left:8px;right:8px;bottom:8px;flex-direction:row;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.selbar.pos-bottom::-webkit-scrollbar{display:none}
.selbar.pos-bottom button{flex:0 0 auto;padding:0 10px;font-size:12px}
.insptabs{display:flex;gap:6px;margin:0 0 10px}
.insptabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 6px;font-family:var(--jp);font-size:12.5px;font-weight:800;color:var(--ink-soft);cursor:pointer}
.insptabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.selbar.pos-left{left:6px;top:50%;transform:translateY(-50%);flex-direction:column;padding:6px;gap:5px}
.selbar.pos-right{right:6px;top:50%;transform:translateY(-50%);flex-direction:column;padding:6px;gap:5px}
.selbar.pos-left .nm,.selbar.pos-right .nm{display:none}
.selbar.pos-left button,.selbar.pos-right button{width:46px;min-width:0;height:36px;padding:0;font-size:10.5px;letter-spacing:-.02em}
.selbar.pos-left button#sbPos,.selbar.pos-right button#sbPos{height:28px;background:rgba(255,255,255,.06)}
.selbar button#sbPos{min-width:34px;background:rgba(255,255,255,.06)}
.fab.fabLeft{right:auto;left:14px}
.nudge{position:absolute;bottom:14px;right:14px;z-index:21;display:none;background:rgba(22,35,47,.9);padding:4px;border-radius:11px;box-shadow:0 6px 18px rgba(22,35,47,.32);touch-action:none}
.nudge.show{display:block}
.ndgrid{display:grid;grid-template-columns:repeat(3,var(--nd,30px));grid-template-rows:repeat(3,calc(var(--nd,30px) - 4px));gap:3px}
.nudge.sz-S{--nd:28px}
.nudge.sz-M{--nd:34px}
.nudge.sz-L{--nd:42px}
.ndhead{display:block;width:100%;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:7px;padding:4px 2px;font-family:var(--jp);font-size:9.5px;font-weight:800;margin-bottom:3px;cursor:grab;letter-spacing:-.03em;touch-action:none;white-space:nowrap}
.ndhead.rz{background:var(--accent)}
.nudge.pos-br{bottom:14px;right:14px;top:auto;left:auto}
.nudge.pos-bl{bottom:14px;left:14px;top:auto;right:auto}
.nudge.pos-tr{top:14px;right:14px;bottom:auto;left:auto}
.nudge.pos-tl{top:14px;left:14px;bottom:auto;right:auto}
.nudge button.cnr{background:rgba(255,255,255,.06);font-size:11px;color:#B9C8D3}
.nudge button.cnr:active{background:rgba(255,255,255,.2)}
.nudge button{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:7px;font-size:13px;display:grid;place-items:center;cursor:pointer;font-family:var(--mono);padding:0;line-height:1}
.nudge button:active{background:var(--accent)}
.nudge button.step{font-size:9px;font-family:var(--jp);font-weight:800;background:rgba(255,255,255,.22);letter-spacing:-.03em}
.nudge span{display:block}
.selbar.show{display:flex}
.selbar .nm{color:#fff;font-size:11.5px;font-weight:700;font-family:var(--jp);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:6px}
.selbar button{height:38px;min-width:42px;border-radius:8px;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:11px;font-weight:700;cursor:pointer;padding:0 8px}
.selbar button.pri{background:var(--accent)}
.selbar button.dngr{background:rgba(224,90,74,.85)}
.fab{position:absolute;right:14px;bottom:60px;width:52px;height:52px;border-radius:16px;background:var(--accent);color:#fff;border:none;font-size:26px;box-shadow:0 8px 20px rgba(14,124,134,.45);cursor:pointer;z-index:19;display:grid;place-items:center}
/* desktop side */
aside.deskside{display:none}
/* ---------- Sections / cards ---------- */
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:14px 15px;margin-bottom:12px;box-shadow:0 1px 2px rgba(22,35,47,.04)}
.card h3{margin:0 0 10px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-soft);font-weight:700;font-family:var(--sans)}
.card h3 .tag{float:right;font-family:var(--mono);font-size:9.5px;color:var(--accent);text-transform:none;letter-spacing:0}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.field label{font-size:10.5px;color:var(--ink-soft);font-weight:600;font-family:var(--jp)}
select,input[type=number],input[type=text]{font-family:var(--mono);font-size:14px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;min-height:38px}
input[type=text]{font-family:var(--jp)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:var(--ink);font-weight:600;font-family:var(--jp);min-height:34px}
.switch input{accent-color:var(--accent);width:17px;height:17px}
button.btn{font-family:var(--jp);font-size:12.5px;font-weight:700;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;min-height:38px}
button.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.deskadd .btn{width:100%}
button.btn:active{background:var(--accent-soft)}
button.btn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
button.btn.del{border-color:#e6b3ae;color:var(--ng)}
.readout{display:flex;justify-content:space-between;align-items:baseline;background:#F4F7F9;border:1px solid var(--line-soft);border-radius:8px;padding:9px 11px;margin-bottom:7px;gap:8px}
.readout .k{font-size:11px;color:var(--ink-soft);font-weight:600;font-family:var(--jp)}
.readout .v{font-family:var(--mono);font-size:13px;font-weight:600;text-align:right}
.grid2{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-family:var(--mono);font-size:12px;margin-top:6px}
.grid2 .g-k{color:var(--ink-soft);font-family:var(--jp)}.grid2 .g-v{text-align:right}
.grid3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:4px 8px;font-family:var(--mono);font-size:12px;margin-top:6px}
.grid3 .h{font-family:var(--jp);color:var(--ink-soft);font-weight:700;font-size:9.5px}
.grid3 .g-k{color:var(--ink-soft);font-family:var(--jp)}.grid3 .g-v{text-align:right}
.subttl{font-size:10.5px;color:var(--ink-soft);font-family:var(--jp);font-weight:700;margin:13px 0 5px}
.hint{font-size:10.5px;color:var(--ink-soft);font-family:var(--jp);line-height:1.6;margin-top:9px}
.ratio{display:flex;justify-content:space-between;align-items:center;margin-top:7px;padding:10px 12px;border-radius:9px;font-family:var(--mono);font-size:12.5px;border:1px solid var(--line-soft);font-weight:600}
.ratio.ok{background:var(--ok-bg);border-color:#B6DEC4;color:var(--ok)}
.ratio.ng{background:var(--ng-bg);border-color:#EAC0B9;color:var(--ng)}
.ratio.warn{background:var(--warn-bg);border-color:#EBD3A8;color:var(--warn)}
.big{background:var(--ink);color:#fff;border-radius:10px;padding:12px 14px;margin-top:9px;display:flex;justify-content:space-between;align-items:baseline}
.big .k{font-size:11.5px;opacity:.85;font-family:var(--jp)}.big .v{font-family:var(--mono);font-size:17px;font-weight:700}
.patlist{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.patlist button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;cursor:pointer;font-family:var(--jp);color:var(--ink)}
.patlist button.on{border-color:var(--accent);background:rgba(14,124,134,.07)}
.patlist button b{display:block;font-size:12.5px;font-weight:800;margin-bottom:3px}
.patlist button .sz{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft)}
.patlist button .sz i{font-style:normal;background:#EEF2F5;border-radius:4px;padding:1px 5px}
.patlist button small{display:block;margin-top:4px;font-size:10px;color:var(--ink-soft);line-height:1.45}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tblwrap table.cost{min-width:560px}
table.cost tr.sumrow td{border-top:1px solid var(--line);font-weight:800}
table.cost{width:100%;border-collapse:collapse;margin-top:4px;font-family:var(--mono);font-size:12px}
table.cost th{font-size:9.5px;color:var(--ink-soft);font-weight:700;text-align:right;padding:3px 4px;font-family:var(--jp)}
table.cost th:first-child{text-align:left}
table.cost td{padding:3px 4px;text-align:right}
table.cost td:first-child{text-align:left;font-family:var(--jp)}
table.cost input{width:64px;text-align:right;padding:6px 6px;min-height:34px}
.kbar{height:9px;border-radius:5px;background:var(--line-soft);overflow:hidden;display:flex;margin:7px 0 5px}
.kbar i{display:block;height:100%}
.legend{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12px;font-family:var(--jp)}
.legend .dot{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.legend .amt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.flags{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;margin:2px 0 8px}
.flags label{display:flex;align-items:center;gap:7px;font-size:12px;font-family:var(--jp);cursor:pointer;min-height:30px}
.flags input{accent-color:var(--accent);width:17px;height:17px}
.miniact{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.miniact button{flex:1;min-width:60px}
.calc{background:#F4F7F9;border:1px solid var(--line-soft);border-radius:8px;padding:10px 11px;font-family:var(--mono);font-size:12px;line-height:1.8}
.calc .rowc{display:flex;justify-content:space-between}
.calc .warnc{color:var(--warn)}.calc .okc{color:var(--ok)}
.empty{color:var(--ink-soft);font-size:12.5px;line-height:1.7;font-family:var(--jp)}
/* ---------- Badges strip ---------- */
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.badge{border-radius:12px;padding:10px 12px;border:1px solid var(--line-soft);background:var(--panel)}
.badge .bk{font-size:10px;color:var(--ink-soft);font-weight:700;font-family:var(--jp)}
.badge .bv{font-family:var(--mono);font-size:15px;font-weight:700;margin-top:2px}
.badge.ok .bv{color:var(--ok)}.badge.ng .bv{color:var(--ng)}.badge.warn .bv{color:var(--warn)}
/* ---------- Building stack view ---------- */
.stack{display:flex;flex-direction:column;gap:0;margin:4px 0 12px}
.slab{display:flex;gap:12px;align-items:stretch;background:var(--panel);border:1px solid var(--line);padding:10px 12px;cursor:pointer;position:relative}
.slab:first-child{border-radius:14px 14px 0 0}
.slab:last-child{border-radius:0 0 14px 14px;border-bottom-width:3px}
.slab + .slab{border-top:none}
.slab:active{background:var(--accent-soft)}
.slab .thumb{flex:0 0 auto;display:grid;place-items:center}
.slab .thumb svg{display:block;background:var(--paper);border:1px solid var(--line-soft);border-radius:4px}
.slab .meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.slab .fn{font-family:var(--mono);font-weight:700;font-size:15px}
.slab .fa{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.slab .fbar{height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden;display:flex}
.slab .fbar i{height:100%}
.slab .go{align-self:center;color:var(--ink-soft);font-size:16px}
.gauge{margin:6px 0 4px}
.gauge .gtrack{position:relative;height:26px;border-radius:8px;background:linear-gradient(90deg,var(--ng-bg),var(--ng-bg) 50%,var(--ok-bg) 50%);border:1px solid var(--line-soft);overflow:hidden}
.gauge .gfill{position:absolute;left:0;top:0;bottom:0;background:var(--own);opacity:.85}
.gauge .gmark{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.gauge .glabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-weight:700;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
/* ---------- Bottom sheets ---------- */
.backdrop{position:fixed;inset:0;background:rgba(22,35,47,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:60}
.backdrop.show{opacity:1;pointer-events:auto}
.bsheet{position:fixed;left:0;right:0;bottom:0;max-height:82dvh;background:var(--panel);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .22s cubic-bezier(.3,.9,.3,1);z-index:70;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(22,35,47,.25)}
.bsheet.open{transform:translateY(0)}
.bsheet .bh{flex:0 0 auto;padding:10px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-soft)}
.bsheet .bh::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:2px;background:var(--line)}
.bsheet .bh b{font-size:13px;font-family:var(--jp);flex:1;padding-top:4px}
.bsheet .bh .close{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px;cursor:pointer}
.bsheet .bc{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(16px + var(--sab))}
/* palette in sheet */
.palcat{font-size:10.5px;color:var(--ink-soft);font-weight:700;font-family:var(--jp);margin:12px 0 7px}
.palcat:first-child{margin-top:0}
.palgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px}
.palgrid button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 6px;font-family:var(--jp);font-size:11.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px}
.palgrid button small{font-family:var(--mono);font-size:9px;color:var(--ink-soft);font-weight:500}

/* ============ v7.1 視認性・UI改善パッケージ ============ */
/* カード: 余白と見出しを整理 */
.card{padding:13px 14px;margin-bottom:11px}

/* フィールドのラベルと入力の詰まり緩和 */
.field{margin-bottom:9px}
.field label{font-size:11px;margin-bottom:3px;display:block;line-height:1.35}
select,input[type=number],input[type=text]{font-size:13.5px;min-height:40px;padding:8px 10px}
/* ボタン: 文字はみ出し対策（省略せず折返し許可＋最小高さ確保） */
button.btn{font-size:12px;padding:10px 12px;min-height:40px;line-height:1.3;white-space:normal;word-break:auto-phrase;height:auto}
.miniact{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.miniact .btn{flex:1 1 auto;min-width:calc(50% - 4px)}
/* セグメント（個人/法人など）の文字はみ出し対策 */
.segrow button{font-size:12px;padding:9px 6px;line-height:1.25;white-space:normal;height:auto;min-height:40px}
/* バッジ: 数値を読みやすく */
.badges{gap:7px;margin-bottom:11px}
.badge{padding:9px 11px;border-radius:11px}
.badge .bk{font-size:9.5px;line-height:1.3}
.badge .bv{font-size:15.5px}
/* 集計グリッド */
.grid2{font-size:11.5px;gap:5px 8px}
.grid3{font-size:11px}
.big{margin-top:9px}
.big .k{font-size:11.5px}.big .v{font-size:17px}
/* refnote/hint: 小さめで詰めて可読 */

/* テーブル全般（コスト・面積・築年など）: フォント最適化 */

/* 比較テーブル */
.comp table{font-size:11px}
.comp th,.comp td{padding:5px 6px}

.walltbl{font-size:10.5px}

/* ステッパー：入力とボタンのバランス */

/* ---- 投資判断：任意合格ライン ---- */
.judgeset{background:#F4F7F9;border:1px solid var(--line-soft);border-radius:10px;padding:10px 11px;margin:6px 0}
.judgeset .jrow{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:11px;margin:3px 0}
.judgeset .jrow b{font-family:var(--mono)}
.judgeref{width:100%;border-collapse:collapse;font-size:10px;margin-top:6px}
.judgeref th,.judgeref td{border:1px solid var(--line-soft);padding:4px 5px;text-align:center}
.judgeref th{background:#EEF2F6;font-family:var(--jp);color:var(--ink-soft);font-weight:700}
.judgeref td:first-child,.judgeref th:first-child{text-align:left;font-family:var(--jp)}
.chip-yes{color:var(--ok);font-weight:700}.chip-no{color:var(--ng);font-weight:700}

/* ---- 情報カード（税・ストレス解説） ---- */
.infocard{background:#F7FAFB;border:1px solid #D6E4E5;border-radius:12px;padding:12px 13px;margin-bottom:11px}
.infocard h4{margin:0 0 7px;font-size:12px;color:var(--accent);font-family:var(--jp);display:flex;align-items:center;gap:6px}
.infocard p{margin:0 0 7px;font-size:11px;line-height:1.65;color:var(--ink);font-family:var(--jp)}
.infocard p:last-child{margin-bottom:0}
.infocard .step{display:flex;gap:8px;margin:5px 0;font-size:11px;font-family:var(--jp);line-height:1.5}
.infocard .step .n{flex:0 0 auto;min-width:20px;height:20px;padding:0 6px;border-radius:11px;background:var(--accent);color:#fff;font-family:var(--jp);font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:1px;white-space:nowrap;line-height:1}
.infocard .hl{background:#FFF6DC;border-radius:3px;padding:0 3px;font-weight:700}

/* ---- フロア管理シート ---- */
.floorlist{display:flex;flex-direction:column;gap:7px;margin-bottom:4px}
.floorrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line-soft);border-radius:10px;padding:8px 10px;background:#fff}
.floorrow.active{border-color:var(--accent);background:var(--accent-soft)}
.floorrow .fi{flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.floorrow .fi b{font-size:14px}
.floorrow .fi small{font-size:10px;color:var(--ink-soft)}
.floorrow .fa2{display:flex;gap:5px;flex:0 0 auto}
.floorrow .fa2 .btn{padding:7px 10px;min-height:34px;font-size:13px;min-width:auto}
.flooradd{display:flex;flex-direction:column;gap:7px}
.flooradd .btn{text-align:left}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hleft"><div class="brand"><b>事業計画スタジオ</b><span>MADORI STUDIO</span></div></div>
    <div class="hright">
      <button class="menuBtn" id="undoBtn" title="元に戻す">↩</button>
      <button class="menuBtn" id="redoBtn" title="やり直す">↪</button>
      <span class="savedot" id="saveDot" title="自動保存">●</span>
      <button class="menuBtn" id="menuBtn" title="メニュー">☰</button>
    </div>
  </header>
  <div class="subhead">
    <div class="modebar" id="modebar">
      <button data-mode="invest" title="収益物件（自宅なし）">🏢 投資</button>
      <button data-mode="hybrid" title="自宅＋賃貸">🏠 併用</button>
      <button data-mode="home" title="自宅のみ">🛏 自宅</button>
    </div>
    <select id="scenSel" title="シナリオ切替"></select>
  </div>
  <nav class="tabbar" id="tabbar">
    <button data-view="plan" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 12h9M12 12v9M12 3v5"/></svg>間取り</button>
    <button data-view="building"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18"/><path d="M5 9h14M5 15h14M12 3v18"/></svg>建物</button>
    <button data-view="tochi"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>土地</button>
    <button data-view="cost"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 20V9l6-5 6 5v11"/><path d="M10 20v-5h4v5"/></svg>コスト</button>
    <button data-view="loan"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 11h18M8 4h8l1 3H7z"/></svg>融資</button>
    <button data-view="sim"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M5 20v-6l4-4 4 3 6-7"/><path d="M19 6v4h-4"/></svg>収支</button>
    <button data-view="sched"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M6 13h6M6 17h9"/></svg>計画</button>
    <button data-view="exit" data-modes="invest hybrid"><svg viewBox="0 0 24 24"><path d="M3 21h18M6 21V8l6-4 6 4v13M10 21v-6h4v6"/><path d="M17 4l3 3-3 3"/></svg>出口</button>
    <button data-view="comp"><svg viewBox="0 0 24 24"><path d="M7 3v18M17 3v18M3 8h8M13 12h8M3 16h8"/></svg>比較</button>
  </nav>
  <main>
    <!-- ===== 間取り ===== -->
    <section class="view active" id="view-plan">
      <div class="plantop">
        <span class="floorlbl">フロア</span>
        <div class="ftabs" id="floortabs"></div>
        <button class="floorbtn" id="addFloor" title="フロアの切替・追加・複製・削除">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 16.5l9 5 9-5"/></svg>追加・編集
        </button>
        <span style="flex:1"></span>
        <button class="iconbtn" id="zoomOut">−</button><span class="zoomval" id="zoomVal">100%</span><button class="iconbtn" id="zoomIn">＋</button>
        <button class="iconbtn" id="zoomFit" title="全体表示">⤢</button>
        <button class="iconbtn lockbtn editing" id="lockBtn" title="編集モード / 閲覧モードの切替">✎ 編集中</button>
        <button class="iconbtn" id="dispBtn" title="表示・設定">⚙</button>
      </div>
      <div class="planbody">
        <div class="stage" id="stage">
          <div class="canvaswrap" id="canvaswrap"><svg class="sheet" id="sheet" xmlns="http://www.w3.org/2000/svg"></svg></div>
          <div class="nudge" id="nudgePad">
            <button class="ndhead" id="ndMode" title="位置微調 ⇄ サイズ変更">✥ 位置を微調整</button>
            <div class="ndgrid">
            <button class="cnr" id="ndPos" title="パッドの位置を変える">✥</button><button data-nd="0,-1" title="上へ">↑</button><button class="cnr" id="ndUp" title="移動量を大きく">＋</button>

            <button class="cnr" id="ndDn" title="移動量を小さく">－</button><button data-nd="0,1" title="下へ">↓</button><button class="cnr" id="ndClose" title="閉じる（移動モードへ）">✕</button>
            </div>
          </div>
          <div class="viewbadge" id="viewBadge">👁 閲覧モード（図面は動かせません）</div>
        </div>
        <aside class="deskside">
          <div class="card deskadd"><button class="btn pri" id="deskAddBtn">＋ 部屋・設備を追加</button><div class="hint" style="margin:7px 0 0">部屋（居室・水回り）や設備（ドア・窓・階段・家具）を配置します。</div></div>
          <div class="card"><h3>選択オブジェクト</h3>
            <div class="empty" id="inspectorEmptyD">タップ / クリックで選択 → そのままドラッグで<b>移動</b>。サイズを変えるときは選択後に「⤢ 変形」を押すとハンドルが出ます（変形中は移動しません）。<br>R=回転 / F=反転 / Del=削除 / ⌘D=複製</div>
            <div id="inspD"></div>
          </div>
          <div class="card"><h3>この階の内訳</h3><div id="floorSummaryD"></div></div>
        </aside>
      </div>
      <button class="fab" id="fabAdd" title="追加">＋</button>
      <div class="selbar pos-left" id="selbar">
        <button id="sbPos" title="バーの位置を変える">⇄</button>
        <span class="nm" id="selName"></span>
        <button id="sbMode" title="移動 / 変形 / 微調 を切替">✋ 移動</button>
        <button id="sbMerge" title="もう一つの部屋と合体">⊕ 合体</button>
        <button id="sbRot">回転</button><button id="sbFlip">反転</button><button id="sbDup">複製</button>
        <button class="pri" id="sbEdit">詳細</button><button class="dngr" id="sbDel">削除</button>
      </div>
    </section>
    <!-- ===== 建物 ===== -->
    <section class="view" id="view-building"><div class="scrollview"><div class="inner" id="buildingView"></div></div></section>
    <!-- ===== 資金 ===== -->
    <section class="view" id="view-tochi"><div class="scrollview"><div class="inner" id="tochiView"></div></div></section>
    <section class="view" id="view-cost"><div class="scrollview"><div class="inner" id="costView"></div></div></section>
    <!-- ===== 融資 ===== -->
    <section class="view" id="view-loan"><div class="scrollview"><div class="inner" id="loanView"></div></div></section>
    <!-- ===== 収支 ===== -->
    <section class="view" id="view-sim"><div class="scrollview"><div class="inner" id="simView"></div></div></section>
      <!-- ===== 計画 ===== -->
    <section class="view" id="view-sched"><div class="scrollview"><div class="inner" id="schedView"></div></div></section>
    <!-- ===== 出口 ===== -->
    <section class="view" id="view-exit"><div class="scrollview"><div class="inner" id="exitView"></div></div></section>
    <!-- ===== 比較 ===== -->
    <section class="view" id="view-comp"><div class="scrollview"><div class="inner" id="compView"></div></div></section>
  </main>
</div>

/* セル分割で被覆を求め、境界辺を有向で抾って1つの環に縫う。

function unionPoly(polys){polys=polys.filter(p=>p&&p.length>=3);if(!polys.length)return null;
  const rd=v=>Math.round(v*1e4)/1e4,K=(x,y)=>rd(x)+','+rd(y);
  const xs=[...new Set([].concat(...polys.map(pl=>pl.map(pt=>rd(pt[0])))))].sort((a,b)=>a-b);
  const ys=[...new Set([].concat(...polys.map(pl=>pl.map(pt=>rd(pt[1])))))].sort((a,b)=>a-b);
  if(xs.length<2||ys.length<2)return null;
  const nx=xs.length-1,ny=ys.length-1,boxes=polys.map(pl=>bbox(pl));
  const cov=[];
  for(let i=0;i<nx;i++){cov[i]=[];const cx=(xs[i]+xs[i+1])/2;
    for(let j=0;j<ny;j++){const cy=(ys[j]+ys[j+1])/2;let c=false;
      for(let k=0;k<polys.length&&!c;k++){const b=boxes[k];
        if(cx<b.x||cx>b.x+b.w||cy<b.y||cy>b.y+b.h)continue;
        if(pointInPoly(cx,cy,polys[k]))c=true;}
      cov[i][j]=c;}}
  const on=(i,j)=>i>=0&&j>=0&&i<nx&&j<ny&&cov[i][j];
  const edges=new Map();const add=(a,b)=>{edges.set(K(a[0],a[1]),[a,b]);};
  for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){if(!cov[i][j])continue;
    const x0=xs[i],x1=xs[i+1],y0=ys[j],y1=ys[j+1];
    if(!on(i,j-1))add([x0,y0],[x1,y0]);
    if(!on(i+1,j))add([x1,y0],[x1,y1]);
    if(!on(i,j+1))add([x1,y1],[x0,y1]);
    if(!on(i-1,j))add([x0,y1],[x0,y0]);}
  if(!edges.size)return null;
  const total=edges.size,ring=[];
  let cur=edges.values().next().value,start=K(cur[0][0],cur[0][1]);
  let guard=0;
  while(guard++<total+5){ring.push(cur[0]);edges.delete(K(cur[0][0],cur[0][1]));
    const nk=K(cur[1][0],cur[1][1]);if(nk===start)break;
    const nxt=edges.get(nk);if(!nxt)return null;cur=nxt;}
  if(edges.size)return null;                    /* 残りがある＝穴 or 非連結 */
  /* 共線頂点を間引く */
  const out=[];for(let i=0;i<ring.length;i++){const a=ring[(i-1+ring.length)%ring.length],b=ring[i],c=ring[(i+1)%ring.length];
    const cr=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);
    if(Math.abs(cr)>1e-9)out.push([b[0],b[1]]);}
  return out.length>=4?out:ring;}

/* 税率（その年の適用税率%）: 個人=限界税率, 法人=実効法人税率 */
function taxRate(sc){const T=sc.tax;return T.entity==='corp'?(+T.corpRate||0):(+T.marginalRate||0);}
/* 不動産所得の税効果（単年・繰越なし簡易。+なら納税/−なら節税、万円/年） */
function taxEffectYear(y,sc,c,sch,rentalRatio,noi,eff){const T=sc.tax;if(!T||!T.rentalTaxOn)return{tax:0,dep:0,taxable:0};
 const dep=deprForYear(y,sc,c,rentalRatio);
 const Y=sch.yr[y-1]||{int:0};
 const taxable=noi-Y.int*rentalRatio-dep;
 const tax=taxable*taxRate(sc)/100;
 return{tax,dep,taxable};}
function financeCalc(sc){sc=sc||state;const c=computeCost(sc),G=sc.finance,LN=activeLoan(sc);
  const income=(+G.incomeSelf||0)+(+G.incomePartner||0);
  const mRent=rentTotal(sc);
  const loan=Math.max(0,c.total-(+G.equity||0));
  const capAmount=(LN.capAmount!=null&&LN.capAmount!=='')?+LN.capAmount:(+G.loanCap||Infinity);
  const capOk=loan<=capAmount;
  const incomeEff=income+mRent*12*(+LN.includeRentPct||0)/100; /* 賃料収入合算後の審査年収 */
  const maxSalary=income*(+G.multSalary||0),maxCombined=incomeEff*(+G.multCombined||0);
  const stress=G.stressOn?{after:+G.stressAfter||0,add:+G.stressAdd||0}:null;
  const schA=schedule(loan,+LN.rate,+LN.years,LN.method,null);
  const schStress=stress?schedule(loan,+LN.rate,+LN.years,LN.method,stress):null;
  const payS1=annMonthly(loan,(+LN.rateScreen)/100/12,LN.years*12)*12;
  const payA1=schA.yr[0]?schA.yr[0].pay:0;
  const dsrA=incomeEff>0?payA1/incomeEff*100:0,dsrS=incomeEff>0?payS1/incomeEff*100:0;
  /* 賃料・NOI（初年度） */
  const rentYear=mRent*12,effRent=rentYear*(1-(G.vacancy||0)/100);
  const mgmt=effRent*(G.mgmtFee||0)/100,opx=effRent*(G.opex||0)/100,fixed=(+G.taxAnnual||0)+(+G.insAnnual||0);
  const noi=effRent-mgmt-opx-fixed;
  /* 面積按分 */
  const{B}=buildingAggSc(sc);const base=B.own+B.rental;const ownRatio=base>0?B.own/base:1,rentalRatio=1-ownRatio;
  const need50=LN.type==='jutaku';
  /* 住宅ローン控除（住宅ローンのみ） */
  const dedEnabled=need50&&G.dedOn;
  const ded1=dedEnabled?dedForYear(1,schA,loan,ownRatio,G):0;
  /* 税効果（不動産所得: 減価償却・利息按分） */
  const tx1=taxEffectYear(1,sc,c,schA,rentalRatio,noi,effRent);
  const netMonthly1=payA1/12-noi/12-ded1/12+tx1.tax/12;
  /* 利回り一式 */
  const grossY=c.total>0?rentYear/c.total*100:0;              /* 表面(総事業費) */
  const grossYB=(c.buildingPrice+c.extrasSum)>0?rentYear/(c.buildingPrice+c.extrasSum)*100:0; /* 建物のみ */
  const effY=c.total>0?effRent/c.total*100:0;                 /* 実効 */
  const netY=c.total>0?noi/c.total*100:0;                     /* NOI(FCR) */
  const kPct=loan>0?payA1/loan*100:0;                         /* ローン定数K% */
  const dscr=payA1>0?noi/payA1:0;
  const yieldGap=netY-kPct;
  const cf1pre=noi-payA1+ded1-tx1.tax;
  const ccr=(+G.equity||0)>0?cf1pre/(+G.equity)*100:0;        /* 自己資金配当率 */
  /* 安全指標 */
  const repayRatio=rentYear>0?payA1/rentYear*100:0;            /* 返済比率（対満室家賃） */
  const opexTotal=mgmt+opx+fixed;
  const expenseRatio=rentYear>0?opexTotal/rentYear*100:0;      /* 経費率（対満室家賃） */
  const berRatio=rentYear>0?(opexTotal+payA1)/rentYear*100:0;  /* 損益分岐入居率(BER) */
  /* 年次CF */
  const cf=cfSeries(schStress||schA,loan,ownRatio,G,sc,c,dedEnabled);
  return{c,income,incomeEff,mRent,loan,capAmount,maxSalary,maxCombined,capOk,schA,schStress,payA1,payS1,dsrA,dsrS,rentYear,effRent,noi,grossY,grossYB,effY,netY,kPct,dscr,yieldGap,ccr,ownRatio,rentalRatio,need50,dedEnabled,ded1,tx1,netMonthly1,cf,stress,LN,repayRatio,expenseRatio,berRatio};}
function dedForYear(y,sch,loan,ownRatio,G){if(!G.dedOn||y>(+G.dedYears||0))return 0;
  const bal=sch.yr[y-1]?sch.yr[y-1].bal:0;
  const target=Math.min(bal*ownRatio,+G.dedCap||0);
  return target*(+G.dedRate||0)/100;}
function cfSeries(sch,loan,ownRatio,G,sc,c,dedEnabled){sc=sc||state;c=c||computeCost(sc);const rows=[];let cum=0;const H=Math.max(1,Math.round(+G.holdYears||1));
  const base=rentTotal(sc)*12,curve=sc.rent.curve,rentalRatio=1-ownRatio;
  const T=sc.tax||{};const rate=taxRate(sc);let carry=0;/* 繰越欠損（万円） */
  for(let y=1;y<=H;y++){
    const rent=base*ageFactor(y,curve);
    const eff=rent*(1-(+G.vacancy||0)/100);
    const mgmt=eff*(+G.mgmtFee||0)/100,opx=eff*(+G.opex||0)/100;
    const fixed=(+G.taxAnnual||0)+(+G.insAnnual||0);
    const noi=eff-mgmt-opx-fixed;
    const repair=(G.repairs||[]).filter(r=>+r.year===y).reduce((a,r)=>a+(+r.amount||0),0);
    const Y=sch.yr[y-1]||{pay:0,bal:0,int:0,pri:0};
    const ded=dedEnabled?dedForYear(y,sch,loan,ownRatio,G):0;
    const dep=(T.rentalTaxOn)?deprForYear(y,sc,c,rentalRatio):0;
    /* 課税所得（不動産所得）: NOI−利息(按分)−償却−修繕(当期経費) */
    let pretax=noi-Y.int*rentalRatio-dep-repair;

        else{usedCarry=Math.min(carry,pretax);taxable=pretax-usedCarry;carry-=usedCarry;}
      }
      tax=Math.max(0,taxable)*rate/100;

      if(sc.tax.entity==='personal'&&pretax<0&&!T.carryLoss)tax=pretax*rate/100;

    const cf=noi-repair-Y.pay+ded-tax;cum+=cf;
    rows.push({y,rent,eff,noi,repair,pay:Y.pay,int:Y.int,ded,dep,pretax,taxable,carry,tax,cf,cum,bal:Y.bal});}

/* ================= 出口・売却・IRR ================= */
function exitCalc(sc,r){const X=sc.exit||defExit(),c=r.c,rr=r.rentalRatio;const H=Math.max(1,Math.round(+X.holdYears||1));
  const noiH=(r.cf[H-1]||r.cf[r.cf.length-1]||{noi:r.noi}).noi;/* 保有末NOI */
  const capBase=(+X.exitCapRate||1)/100;
  const priceBase=capBase>0?noiH/capBase:0;/* 直接還元 */
  const capStress=(+X.exitCapRate+ +X.capRateStress)/100;
  const priceStress=capStress>0?noiH/capStress:0;
  const balH=(r.cf[H-1]||{}).bal||0;
  const sellCost=v=>v*(+X.sellCostPct||0)/100;
  /* 税務簿価：土地(取得原価)＋建物簿価 */
  const landCost=c.landPrice;const bldBook=bldBookValue(H,sc,c,rr);const book=landCost+bldBook;
  const capGainTaxRate=(+X.longTerm?20.315:39.63);/* 個人譲渡（法人は通常税率だが簡易に個人前提、法人はcorpRate） */
  const useRate=sc.tax.entity==='corp'?(+sc.tax.corpRate||0):capGainTaxRate;
  const scen=(price)=>{const net=price-sellCost(price);const gain=price-book-sellCost(price);const tax=Math.max(0,gain)*useRate/100;const cfSell=net-balH-tax;return{price,net,gain,tax,cfSell};};
  const base=scen(priceBase),stress=scen(priceStress);
  const cumCF=(r.cf[H-1]||{}).cum||0;
  /* IRR: 初期=−自己資金, 各年=年CF, 最終年=年CF+売却時CF */
  const equity=+sc.finance.equity||0;
  const flowsPre=[-r.c.total+r.loan];/* 税引前IRR用: 自己資金流出 */
  const eq=-equity;
  const cfsPre=[eq],cfsPost=[eq];
  for(let y=1;y<=H;y++){const row=r.cf[y-1]||{cf:0,tax:0};let pre=row.cf+row.tax;let post=row.cf;if(y===H){pre+=base.cfSell+base.tax;post+=base.cfSell;}cfsPre.push(pre);cfsPost.push(post);}

  const multiple=equity>0?(cumCF+base.cfSell+equity)/equity:0;

/* IRR（ニュートン＋二分法フォールバック、月次でなく年次） */
function npv(rate,cfs){let s=0;for(let i=0;i<cfs.length;i++)s+=cfs[i]/Math.pow(1+rate,i);return s;}
function irr(cfs){if(!cfs.some(v=>v>0)||!cfs.some(v=>v<0))return null;let lo=-0.9,hi=1.0;let flo=npv(lo,cfs),fhi=npv(hi,cfs);
  if(flo*fhi>0){for(hi=1.0;hi<20;hi+=0.5){fhi=npv(hi,cfs);if(flo*fhi<0)break;}if(flo*fhi>0)return null;}

function mirr(cfs,fin){const n=cfs.length-1;if(n<1)return null;let pvNeg=0,fvPos=0;const reinvest=fin,finance=fin;
  for(let i=0;i<cfs.length;i++){if(cfs[i]<0)pvNeg+=cfs[i]/Math.pow(1+finance,i);else fvPos+=cfs[i]*Math.pow(1+reinvest,n-i);}
  if(pvNeg===0||fvPos<=0)return null;return (Math.pow(fvPos/-pvNeg,1/n)-1)*100;}
/* 投資判断マトリクス（BFコンサル式）: ROI=税引前CF/投資総額, 損益分岐点=支出/満室家賃 */
function investJudge(r){const roi=r.c.total>0?(r.noi-r.payA1)/r.c.total*100:0;
  const outgo=r.noi>=0?(r.effRent-r.noi)+r.payA1:r.payA1;/* 運営費+返済 */
  const be=r.rentYear>0?outgo/r.rentYear*100:999;
  const safe=be<75?'A':(be<=80?'B':'C');
  const prof=roi>=4?'A':(roi>=3?'B':'C');
  const grade=(safe==='A'&&prof==='A')?'○':((safe==='C'||prof==='C')?'×':'△');
  const J=(state.judge)||defJudge();const roiPass=+J.roiPass||0,berPass=+J.berPass||100;

  return{roi,be,outgo,safe,prof,grade,roiPass,berPass,roiOK,berOK,passAll};}

function chart(opts){
  const W=opts.w||680,H=opts.h||220,padL=52,padR=12,padT=12,padB=24;
  const n=opts.n;const iw=W-padL-padR,ih=H-padT-padB;
  let mn=0,mx=0;
  opts.series.forEach(s=>s.vals.forEach(v=>{if(v==null)return;mn=Math.min(mn,v);mx=Math.max(mx,v);}));
  if(mx===mn){mx=mn+1;}
  const pad=(mx-mn)*.08;mx+=pad;if(mn<0)mn-=pad;
  const Y=v=>padT+ih-(v-mn)/(mx-mn)*ih;
  const X=i=>padL+(n<=1?iw/2:i/(n-1)*iw);
  const XB=i=>padL+i/n*iw;
  const svg=E('svg',{viewBox:`0 0 ${W} ${H}`,xmlns:SVGNS});
  const ticks=4;
  for(let t=0;t<=ticks;t++){const v=mn+(mx-mn)*t/ticks,y=Y(v);
    svg.appendChild(E('line',{x1:padL,y1:y,x2:W-padR,y2:y,stroke:'#E3EAEF','stroke-width':1}));
    svg.appendChild(txt(padL-6,y,Math.abs(v)>=10000?(v/10000).toFixed(1)+'億':f0(v),{mono:true,size:9,fill:'#54677A',anchor:'end'}));}
  if(mn<0){svg.appendChild(E('line',{x1:padL,y1:Y(0),x2:W-padR,y2:Y(0),stroke:'#54677A','stroke-width':1.2}));}
  const step=Math.max(1,Math.ceil(n/8));
  for(let i=0;i<n;i+=step)svg.appendChild(txt(opts.bar?XB(i)+iw/n/2:X(i),H-8,String((opts.x0||1)+i),{mono:true,size:9,fill:'#54677A'}));
  opts.series.forEach(s=>{
    if(s.type==='bar'){const bw=Math.max(2,iw/n*.62);
      s.vals.forEach((v,i)=>{if(v==null)return;const x=XB(i)+ (iw/n-bw)/2,y0=Y(0),y1=Y(v);
        svg.appendChild(E('rect',{x,y:Math.min(y0,y1),width:bw,height:Math.max(1,Math.abs(y0-y1)),fill:v>=0?(s.color||'#0E7C86'):(s.negColor||'#C0453B'),opacity:.85,rx:1}));});}
    else{let d='';s.vals.forEach((v,i)=>{if(v==null)return;d+=(d?' L ':'M ')+X(i)+' '+Y(v);});
      svg.appendChild(E('path',{d,fill:'none',stroke:s.color||'#16232F','stroke-width':s.width||2,'stroke-dasharray':s.dash||null,'stroke-linejoin':'round'}));}});
  return svg;}

function setbackOver(f,reg){reg=reg||landReg(state);f=f||F();
  const dW=f.footW-reg.buildW,dD=f.footH-reg.buildD;
  return{reg,dW,dD,wOK:dW<=1e-6,dOK:dD<=1e-6,over:(dW>1e-6||dD>1e-6)};}
function anyFloorOverSetback(){const reg=landReg(state);
  return state.floors.some(fl=>fl.footW>reg.buildW+1e-6||fl.footH>reg.buildD+1e-6);}
function fitAllFloorsToSetback(reg){reg=reg||landReg(state);

  state.floors.forEach(fl=>{fl.footW=Math.min(fl.footW,reg.buildW);fl.footH=Math.min(fl.footH,reg.buildD);});
  render();}
/* ================= 枠の自動計算（法規MAX） ================= */
const FRAME_TARGETS=[['setback','離隔MAX'],['bcr','建ぺいMAX'],['far','容積MAX'],['legal','法規MAX（推奨）']];
/* 目標ごとの「1フロアの建物枠」を算出。
   枠は「これを埋め尽くしたときの上限」として扱う（部屋の充填率に依存させない→発散しない）。
   個別指定（manual）フロアの容積対象は実値を差し引いて、連動フロアで割り付ける。*/
function frameTargets(){const reg=landReg(state),la=landArea(state),L=state.land;
  const Wm=Math.max(0,reg.buildW),Dm=Math.max(0,reg.buildD),boxA=Wm*Dm;
  const bcrCap=la*(+L.bcrLimit||0)/100, farCap=la*(reg.effFar||0)/100;
  const auto=state.floors.filter(f=>(f.frameMode||'manual')==='auto');
  const manual=state.floors.filter(f=>(f.frameMode||'manual')!=='auto');
  /* 連動フロアがある場合だけ、個別フロアの実容積を控除して残りを連動フロアで割る。
     全部個別のときは「全階をこのサイズにしたら」の仮定で全階数で割る（控除なし）。*/
  const useAuto=auto.length>0;
  const manFar=useAuto?manual.reduce((a,f)=>a+floorTotals(f).basis.far,0):0;
  const n=Math.max(1,useAuto?auto.length:state.floors.length);
  const farPerFloor=Math.max(0,farCap-manFar)/n;
  const caps={setback:boxA,bcr:Math.min(boxA,bcrCap),far:Math.min(boxA,farPerFloor)};
  caps.legal=Math.min(caps.setback,caps.bcr,caps.far);
  const mk=A=>{const k=boxA>0?Math.min(1,Math.sqrt(Math.max(0,A)/boxA)):0;
    const W=Math.floor(Wm*k*200)/200,D=Math.floor(Dm*k*200)/200;return{W,D,area:W*D,cap:A};};
  const out={};Object.keys(caps).forEach(k=>out[k]=mk(caps[k]));
  out.bind=['setback','bcr','far'].reduce((b,k)=>caps[k]<caps[b]-1e-9?k:b,'setback');
  out.meta={Wm,Dm,boxA,bcrCap,farCap,manFar,autoN:auto.length,manualN:manual.length,farPerFloor,n};
  return out;}
/* 連動（auto）フロアの枠を目標値に追従させる。renderの先頭で呼ぶ */
function syncAutoFrames(){if(!state.floors.some(f=>(f.frameMode||'manual')==='auto'))return;
  const t=frameTargets(),tg=t[state.frameTarget||'legal'];if(!tg||tg.W<1||tg.D<1)return;
  state.floors.forEach(f=>{if((f.frameMode||'manual')==='auto'){f.footW=tg.W;f.footH=tg.D;}});}

/* ================= フロア管理（追加・複製・削除） ================= */
function addFloorFrom(srcId){const src=srcId?state.floors.find(f=>f.id===srcId):null;
  const ref=state.floors[0]||{footW:8.19,footH:9.1};
  const nf={id:nid('f'),name:(state.floors.length+1)+'F',footW:src?src.footW:ref.footW,footH:src?src.footH:ref.footH,rooms:[],elems:[]};
  if(src){nf.rooms=clone(src.rooms);nf.rooms.forEach(r=>r.id=nid('r'));nf.elems=clone(src.elems);nf.elems.forEach(e=>e.id=nid('e'));}
  state.floors.unshift(nf);state.activeFloorId=nf.id;view.sel=null;closeSheet();switchTab('plan');render();}
/* 階の並べ替え（dir=-1:上へ / +1:下へ。配列の先頭が最上階） */
function moveFloor(id,dir){const i=state.floors.findIndex(f=>f.id===id);if(i<0)return;
  const j=i+dir;if(j<0||j>=state.floors.length)return;
  const a=state.floors;[a[i],a[j]]=[a[j],a[i]];render();buildFloorSheet();}
/* 下から 1F,2F,... に付け直す */
function renumberFloors(){const n=state.floors.length;
  state.floors.forEach((f,i)=>{f.name=(n-i)+'F';});render();buildFloorSheet();}
/* 階数を直接指定（増やす=最上階をコピーして上に積む / 減らす=上から削除） */
function setFloorCount(n,copy){n=Math.max(1,Math.min(12,Math.round(+n||1)));
  const cur=state.floors.length;if(n===cur)return;
  if(n<cur){const gone=state.floors.slice(0,cur-n);
    if(!confirm('上から '+(cur-n)+' 階（'+gone.map(f=>f.name).join('、')+'）を削除します。\n間取りも一緒に消えますが、よろしいですか？（↩で戻せます）'))return;
    state.floors=state.floors.slice(cur-n);}
  else{for(let k=cur;k<n;k++){const src=copy?state.floors[0]:null;
      const ref=state.floors[0]||{footW:8.19,footH:9.1};
      const nf={id:nid('f'),name:(k+1)+'F',footW:src?src.footW:ref.footW,footH:src?src.footH:ref.footH,rooms:[],elems:[],frameMode:src?src.frameMode:undefined};
      if(src){nf.rooms=clone(src.rooms);nf.rooms.forEach(r=>r.id=nid('r'));nf.elems=clone(src.elems);nf.elems.forEach(e=>e.id=nid('e'));}
      state.floors.unshift(nf);}}
  if(!state.floors.find(f=>f.id===state.activeFloorId))state.activeFloorId=state.floors[0].id;
  view.sel=null;render();buildFloorSheet();}
function deleteFloor(id){if(state.floors.length<=1){alert('最後のフロアは削除できません。');return;}
  const f=state.floors.find(x=>x.id===id);if(!f)return;
  if(!confirm('「'+f.name+'」を削除しますか？\n（↩ボタンで元に戻せます）'))return;
  state.floors=state.floors.filter(x=>x.id!==id);
  if(state.activeFloorId===id)state.activeFloorId=state.floors[0].id;
  if(state.price&&state.price.perFloor)delete state.price.perFloor[id];
  view.sel=null;render();buildFloorSheet();}

    row.appendChild(acts);list.appendChild(row);});
  box.appendChild(list);
  box.appendChild(btn('↺ 階名を下から 1F・2F・… に付け直す',()=>{if(confirm('現在の並び順に合わせて、下から 1F、2F… と名前を付け直します。よろしいですか？'))renumberFloors();}));

/* --- 平面図をSVG文字列で取得（任意シナリオ・階） --- */
function floorSVG(sc,f,px){px=px||38;let mr=f.footW,mb=f.footH;
  f.rooms.forEach(r=>{const b=bbox(r.poly);mr=Math.max(mr,b.x+b.w);mb=Math.max(mb,b.y+b.h);});
  f.elems.forEach(e=>{mr=Math.max(mr,e.x+e.w);mb=Math.max(mb,e.y+e.h);});
  const M=1.1,off=M*.6*px,W=(mr+M)*px,H=(mb+M)*px;
  let s=`<svg xmlns="${SVGNS}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="sans-serif"><rect width="${W}" height="${H}" fill="#fff"/><g transform="translate(${off},${off})">`;
  for(let x=0;x<=mr+1e-6;x+=0.91)s+=`<line x1="${x*px}" y1="0" x2="${x*px}" y2="${mb*px}" stroke="#EEF2F6"/>`;
  for(let y=0;y<=mb+1e-6;y+=0.91)s+=`<line x1="0" y1="${y*px}" x2="${mr*px}" y2="${y*px}" stroke="#EEF2F6"/>`;
  f.rooms.forEach(r=>{const col=SPACE[r.type]?.color||'#34506B';s+=`<polygon points="${r.poly.map(([x,y])=>x*px+','+y*px).join(' ')}" fill="${hexA(col,.16)}" stroke="${col}" stroke-width="1.2"/>`;
    const[cx,cy]=centroid(r.poly),ar=polyArea(r.poly);s+=`<text x="${cx*px}" y="${cy*px-4}" font-size="11" font-weight="700" text-anchor="middle" fill="#16232F">${esc(r.name)}</text><text x="${cx*px}" y="${cy*px+10}" font-size="9" text-anchor="middle" fill="#54677A">${f1(ar)}㎡</text>`;});
  s+=`<rect x="0" y="0" width="${f.footW*px}" height="${f.footH*px}" fill="none" stroke="#16232F" stroke-width="2"/></g></svg>`;
  return s;}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* --- PDF用インラインSVGチャート（文字列） --- */
function pdfChart(opts){const W=opts.w||720,H=opts.h||210,padL=54,padR=14,padT=14,padB=26;
  const n=opts.n,iw=W-padL-padR,ih=H-padT-padB;let mn=0,mx=0;
  opts.series.forEach(se=>se.vals.forEach(v=>{if(v==null)return;mn=Math.min(mn,v);mx=Math.max(mx,v);}));
  if(mx===mn)mx=mn+1;const pd=(mx-mn)*.08;mx+=pd;if(mn<0)mn-=pd;
  const Y=v=>padT+ih-(v-mn)/(mx-mn)*ih,X=i=>padL+(n<=1?iw/2:i/(n-1)*iw),XB=i=>padL+i/n*iw;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="sans-serif"><rect width="${W}" height="${H}" fill="#fff"/>`;
  for(let t=0;t<=4;t++){const v=mn+(mx-mn)*t/4,y=Y(v);s+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#E3EAEF"/><text x="${padL-6}" y="${y+3}" font-size="9" text-anchor="end" fill="#54677A">${Math.abs(v)>=10000?(v/10000).toFixed(1)+'億':f0(v)}</text>`;}
  if(mn<0)s+=`<line x1="${padL}" y1="${Y(0)}" x2="${W-padR}" y2="${Y(0)}" stroke="#54677A"/>`;
  const step=Math.max(1,Math.ceil(n/10));
  for(let i=0;i<n;i+=step)s+=`<text x="${opts.bar?XB(i)+iw/n/2:X(i)}" y="${H-8}" font-size="9" text-anchor="middle" fill="#54677A">${(opts.x0||1)+i}</text>`;
  opts.series.forEach(se=>{
    if(se.type==='bar'){const bw=Math.max(2,iw/n*.6);se.vals.forEach((v,i)=>{if(v==null)return;const x=XB(i)+(iw/n-bw)/2,y0=Y(0),y1=Y(v);s+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(1,Math.abs(y0-y1))}" fill="${v>=0?(se.color||'#0E7C86'):(se.negColor||'#C0453B')}" opacity="0.85"/>`;});}
    else{let d='';se.vals.forEach((v,i)=>{if(v==null)return;d+=(d?' L ':'M ')+X(i)+' '+Y(v);});s+=`<path d="${d}" fill="none" stroke="${se.color||'#16232F'}" stroke-width="${se.width||2}" stroke-dasharray="${se.dash||''}"/>`;}
  });
  return s+`</svg>`;}
/* --- PDF用ウォーターフォール（CFツリー）SVG文字列 --- */
function pdfWaterfall(rows,base){const W=720,rowH=30,H=rows.length*rowH+8,labW=150,barW=W-labW-120;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="sans-serif"><rect width="${W}" height="${H}" fill="#fff"/>`;
  rows.forEach((r,i)=>{const y=i*rowH+4,w=Math.min(barW,Math.abs(r.val)/base*barW);
    s+=`<text x="0" y="${y+rowH/2+4}" font-size="11" fill="${r.tot?'#16232F':'#54677A'}" font-weight="${r.tot?'700':'400'}">${esc(r.lb)}</text>`;
    s+=`<rect x="${labW}" y="${y+6}" width="${barW}" height="${rowH-14}" fill="#F1F5F8" rx="4"/>`;
    s+=`<rect x="${labW}" y="${y+6}" width="${w}" height="${rowH-14}" fill="${r.col}" rx="4"/>`;
    s+=`<text x="${W}" y="${y+rowH/2+4}" font-size="11" text-anchor="end" font-weight="700" fill="${r.val<0?'#B4402F':(r.tot?'#16232F':'#1E7A45')}">${(r.val<0?'−':(r.sign?'+':''))+f0(Math.abs(r.val))}万</text>`;});
  return s+`</svg>`;}

function exportExcel(sc){migrateScenario(sc);const r=financeCalc(sc);const agg=buildingAggSc(sc);const S=window._exSel||{};
  const sheets={};
  if(S.summary){const aoa=[['項目','値'],['シナリオ',sc.name],['延床面積(㎡)',+f1(agg.gross)],['自宅専有率(%)',+f1((agg.B.own/(agg.B.own+agg.B.rental)||0)*100)],['敷地面積(㎡)',+f1(r.c.la)],['総事業費(万円)',Math.round(r.c.total)]];sheets['概要']=aoa;
    const fa=[['階','壁芯㎡','内法㎡','賃貸㎡','自宅㎡']];sc.floors.forEach(f=>{const t=floorTotalsSc(f,sc);fa.push([f.name,+f1(t.gross),+f1(t.net),+f1(t.basis.rental),+f1(t.basis.own)]);});sheets['面積集計']=fa;}
  if(S.cost){const a=[['区分','金額(万円)'],['①土地',Math.round(r.c.landPrice)],['②建物本体(付帯込)',Math.round(r.c.buildingPrice)],['③別途工事',Math.round(r.c.extrasSum)],['③諸費用',Math.round(r.c.misc)],['総事業費',Math.round(r.c.total)],[],['積算内訳','金額(万円)']];r.c.seisan.forEach(x=>a.push([x.n,Math.round(x.amt)]));sheets['資金計画']=a;}
  if(S.loan){const a=[['銀行','商品','種別','金利%','期間','月返済(万)','返済比率%','融資上限(万)']];sc.loans.forEach(LN=>{const pl=calcPlan(LN,r.c,sc.finance,r.mRent,r.income,agg);a.push([LN.name,LN.product||'',LOANTYPES[LN.type].label,LN.rate,LN.years,+fmt(pl.sch.firstMonthly,1),+f1(pl.dsrS),LN.capAmount||'']);});sheets['融資比較']=a;}
  if(S.rent){const a=[['階','部屋','面積㎡','賃料(万)','㎡単価(円)','稼働']];rentUnits(sc).forEach(u=>a.push([u.floor,u.name,+f1(u.area),+f1(u.rent),u.area>0?Math.round(u.rent*10000/u.area):0,u.occ?'○':'×']));sheets['レントロール']=a;}
  if(S.repay){const a=[['年','年返済(万)','元金(万)','利息(万)','残債(万)']];r.schA.yr.forEach((y,i)=>a.push([i+1,+f0(y.pay),+f0(y.pri),+f0(y.int),+f0(y.bal)]));sheets['返済年表']=a;}
  if(S.cf){const a=[['年','満室賃料','NOI','修繕','返済','控除','償却','税額','年CF','累計','残債']];r.cf.forEach(x=>a.push([x.y,+f0(x.rent),+f0(x.noi),+f0(x.repair),+f0(x.pay),+f0(x.ded),+f0(x.dep),+f0(x.tax),+f0(x.cf),+f0(x.cum),+f0(x.bal)]));sheets['年次CF']=a;}
  if(S.exit){const ex=exitCalc(sc,r);const a=[['項目','値'],['保有年数',ex.H],['想定売却価格(万)',Math.round(ex.base.price)],['税務簿価(万)',Math.round(ex.book)],['残債(万)',Math.round(ex.balH)],['譲渡益(万)',Math.round(ex.base.gain)],['譲渡税(万)',Math.round(ex.base.tax)],['売却時CF(万)',Math.round(ex.base.cfSell)],['税引前IRR(%)',ex.preIRR==null?'':+f1(ex.preIRR)],['税引後IRR(%)',ex.postIRR==null?'':+f1(ex.postIRR)],['税引前MIRR(%)',ex.preMIRR==null?'':+f1(ex.preMIRR)],['税引後MIRR(%)',ex.postMIRR==null?'':+f1(ex.postMIRR)],['マルチプル',+fmt(ex.multiple,2)],['純資産(万)',Math.round(ex.cumCF+ex.base.cfSell)]];sheets['出口・IRR']=a;}
  if(S.sched){const a=[['タスク','区分','開始(月)','期間(月)','支出(万)','メモ','完了']];(sc.sched.items||[]).forEach(it=>a.push([it.name,(SCHEDCATS[it.cat]||['他'])[0],it.start,it.dur,it.cost,it.task||'',it.done?'○':'']));sheets['スケジュール']=a;}
  if(!Object.keys(sheets).length){alert('出力する項目を選んでください。');return;}
  const done=()=>{try{const wb=XLSX.utils.book_new();Object.entries(sheets).forEach(([nm,aoa])=>{const ws=XLSX.utils.aoa_to_sheet(aoa);XLSX.utils.book_append_sheet(wb,ws,nm.slice(0,31));});XLSX.writeFile(wb,`事業計画_${sc.name}_${new Date().toISOString().slice(0,10)}.xlsx`);closeSheet();}catch(e){csvFallback(sheets,sc);}};
  if(window.XLSX)return done();
  const sp=document.createElement('script');sp.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  sp.onload=done;sp.onerror=()=>csvFallback(sheets,sc);document.head.appendChild(sp);}
function csvFallback(sheets,sc){let csv='';Object.entries(sheets).forEach(([nm,aoa])=>{csv+='■ '+nm+'\n'+aoa.map(row=>row.map(c=>{const s=String(c==null?'':c);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n')+'\n\n';});
  dl(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),`事業計画_${sc.name}.csv`);
  alert('Excelライブラリを読み込めなかったため、CSV形式で出力しました。');closeSheet();}

function renderCFTreeCard(r){const c=el('div','card');c.appendChild(el('h3','','キャッシュフローツリー<span class="tag">初年度・年額</span>'));
  const full=r.rentYear,vac=full-r.effRent,opex=r.effRent-r.noi,noi=r.noi,pay=r.payA1,zei=r.tx1.tax,cfPre=noi-pay,cfPost=cfPre-zei;
  const base=Math.max(1,full);
  const vacPct=r.rentYear?f1((1-r.effRent/r.rentYear)*100):'—';
  /* ウォーターフォール（各行＝満室家賃を100%とした横バー＋金額） */
  const wf=el('div','cfwf');
  const row=(lb,val,col,{sub,tot,sign}={})=>{
    const w=Math.min(100,Math.abs(val)/base*100);
    const amtCls=sign?(val>=0?'pos':'neg'):'';
    const disp=(sign?(val>=0?'+':'−'):(sign===false?'−':''))+f0(Math.abs(val))+'万';
    return `<div class="r ${sub?'sub':''} ${tot?'tot':''}"><span class="lb">${lb}</span>`+
      `<span class="track"><span class="fill" style="width:${w}%;background:${col}"></span></span>`+
      `<span class="amt ${amtCls}">${disp}</span></div>`;};
  wf.innerHTML=
    row('満室家賃',full,'#0E7C86')+
    row('− 空室損 '+vacPct+'%',vac,'#B9C4CF',{sub:true,sign:false})+
    row('− 運営費',opex,'#C79A2E',{sub:true,sign:false})+
    row('＝ NOI',noi,'#2E7D5B',{tot:true})+
    row('− ローン返済',pay,'#7A8794',{sub:true,sign:false})+
    row('＝ 税引前CF',cfPre,cfPre>=0?'#34506B':'#C0453B',{tot:true,sign:true})+
    row((zei<=0?'＋ 税の節税効果':'− 税額'),Math.abs(zei),zei<=0?'#2E7D5B':'#C0453B',{sub:true,sign:false})+
    row('＝ 税引後CF',cfPost,cfPost>=0?'#34506B':'#C0453B',{tot:true,sign:true});
  c.appendChild(wf);
  c.appendChild(el('div','refnote','各バーは「満室家賃」を基準にした比率。左の項目名と右の金額で必ず数値が読めます。'+(cfPre<0?'本件は税引前CFがマイナス＝毎年の持ち出しがある状態（逆レバ）。自宅部分の住居費削減・元本返済・土地資産で判断します。':'')));
  return c;}
function renderJudgeCard(r){const j=investJudge(r);const c=el('div','card');c.appendChild(el('h3','','投資判断<span class="tag">合格ライン=任意設定</span>'));
  const J=state.judge||(state.judge=defJudge());
  /* 現状値 */
  c.appendChild(el('div','grid2',
    `<span class="g-k">実質利回り ROI（税引前CF÷投資総額）</span><span class="g-v ${j.roiOK?'pos':'neg'}"><b>${f1(j.roi)}%</b></span>`+
    `<span class="g-k">損益分岐点 BER（支出÷満室家賃）</span><span class="g-v ${j.berOK?'pos':'neg'}">${f1(j.be)}%</span>`+
    `<span class="g-k">レバレッジ</span><span class="g-v ${r.yieldGap>=0?'pos':'neg'}">${r.yieldGap>=0?'正':'負(逆レバ)'}</span>`));
  /* 任意合格ライン設定 */
  const js=el('div','judgeset');
  js.appendChild(el('div','jrow','<span>合格ライン（自分の基準で設定）</span>'));
  const jg=el('div','row2');
  jg.appendChild(fNum('合格 ROI（%以上）',J.roiPass,.5,v=>{J.roiPass=v||0;render();}));
  jg.appendChild(fNum('合格 BER（%以下）',J.berPass,1,v=>{J.berPass=v||0;render();}));

/* ================= 個人／法人 税引後CF比較（初年度） ================= */
function renderEntityCompareCard(r){const sc=state,c=r.c;

    const cw=el('div','comp');const t=document.createElement('table');
    const data=store.scenarios.map(sc=>{migrateScenario(sc);return{sc,reg:landReg(sc),ev:landEval(sc),price:(sc.land.priceManual!=null&&sc.land.priceManual!==''?+sc.land.priceManual:computeCost(sc).landPrice)};});
    let hd='<tr class="hd"><th>項目</th>'+data.map(d=>`<th>${d.sc.name}${d.sc.id===store.activeId?' ★':''}</th>`).join('')+'</tr>';
    const vpill=lv=>lv==='ok'?'<span style="color:var(--ok)">建築可</span>':(lv==='warn'?'<span style="color:var(--warn)">要注意</span>':'<span style="color:var(--ng)">不可</span>');
    const rows=[['判定',d=>vpill(d.ev.level)],['用途地域',d=>d.reg.info.label],['敷地',d=>f0(d.reg.area)+'㎡'],['土地坪単価',d=>d.reg.areaT>0?f1(d.price/d.reg.areaT)+'万':'—'],['建築面積単価',d=>d.reg.maxFloorT>0?f1(d.price/d.reg.maxFloorT)+'万':'—'],['建築可能延床',d=>f0(d.reg.maxFloor)+'㎡'],['目標260㎡',d=>d.reg.maxFloor>=260?'○':'×']];
    let bh='';rows.forEach(([lb,fn])=>{bh+='<tr><td>'+lb+'</td>'+data.map(d=>'<td>'+fn(d)+'</td>').join('')+'</tr>';});
    t.innerHTML=hd+bh;cw.appendChild(t);c5.appendChild(cw);box.appendChild(c5);
  }
  box.appendChild(el('div','hint','※簡易判定です。角地緩和・日影規制・地区計画・既存不適格等は未反映。最終判断は役所窓口・重要事項説明で確認を。'));
}

</script>
