name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # index.html が読み込むファイルと sw.js の事前キャッシュ一覧が一致しているか確認
      - name: Check service worker precache list
        run: node tools/update-sw-precache.mjs --check

      # デプロイごとに Service Worker のキャッシュ名を変え、古いキャッシュを一掃する
      - name: Stamp version
        run: node tools/stamp-version.mjs "${GITHUB_SHA::12}"

      # enablement: true … Pages未設定でも、この実行時に「GitHub Actionsで配信」を自動で有効化する
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
